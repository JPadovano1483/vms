# postgres-credentials-externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres-credentials
        property: postgres-password
    - secretKey: app-user-password
      remoteRef:
        key: postgres-credentials
        property: app-user-password
    - secretKey: app-system-password
      remoteRef:
        key: postgres-credentials
        property: app-system-password
